<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordinator</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
/* Coordinator brand tokens (DESIGN.md, src/styles/tokens.css of the website) */
:root{
  color-scheme:light dark;
  --co-bg:#fafafd;--co-surface:#ffffff;--co-sunken:#f2f2f6;--co-line:#dfdfe6;--co-line-strong:#c3c3cc;
  --co-ink:#151520;--co-ink-2:#464652;--co-muted:#62626d;
  --co-accent:#6a44da;--co-accent-strong:#5732bb;--co-accent-soft:#edecff;--co-on-accent:#fbfbff;
  --co-ok:#0b7643;--co-ok-soft:#dff8e6;--co-warn:#935a11;--co-warn-soft:#ffefd1;
  --co-bad:#b02a2d;--co-bad-soft:#ffe9e6;--co-info:#0065b4;--co-info-soft:#e4f2ff;
  --co-shadow-color:rgb(21 21 32 / 0.1);
  --co-shadow-1:0 1px 2px var(--co-shadow-color),0 4px 12px -6px var(--co-shadow-color);
  --co-shadow-2:0 2px 4px var(--co-shadow-color),0 18px 40px -16px var(--co-shadow-color);
  --co-focus-ring:0 0 0 2px var(--co-bg),0 0 0 4px var(--co-accent);
  --co-font-sans:"Plus Jakarta Sans","Plus Jakarta Sans Fallback",ui-sans-serif,system-ui,sans-serif;
  --co-font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --co-text-xs:0.8125rem;--co-text-sm:0.875rem;--co-text-base:1rem;--co-text-md:1.125rem;--co-text-lg:1.375rem;
  --co-weight-strong:650;--co-weight-display:680;
  --co-leading-heading:1.15;--co-leading-body:1.6;--co-tracking-heading:-0.02em;--co-measure:68ch;
  --co-radius-sm:6px;--co-radius-md:10px;--co-radius-lg:16px;--co-radius-pill:999px;
  --co-dur-instant:120ms;--co-dur-quick:200ms;--co-dur-base:320ms;--co-dur-page:440ms;
  --co-dur-reveal:760ms;--co-dur-sequence:1200ms;
  --co-ease-arrive:cubic-bezier(0.16,1,0.3,1);--co-ease-move:cubic-bezier(0.65,0,0.35,1);--co-ease-leave:cubic-bezier(0.5,0,0.75,0);
  --co-stagger:70ms;--co-rise:12px;--co-reveal-blur:8px;
}
@media (prefers-color-scheme:dark){:root{
  --co-bg:#0d0c13;--co-surface:#15151d;--co-sunken:#08080d;--co-line:#2a2a34;--co-line-strong:#41414d;
  --co-ink:#eeeef2;--co-ink-2:#c3c3cc;--co-muted:#9a9aa5;
  --co-accent:#aa99ff;--co-accent-strong:#c3b8ff;--co-accent-soft:#262041;--co-on-accent:#0f0d1c;
  --co-ok:#72d699;--co-ok-soft:#102a1a;--co-warn:#f5bc69;--co-warn-soft:#34220b;
  --co-bad:#f58b84;--co-bad-soft:#3b1c1a;--co-info:#79b6f4;--co-info-soft:#0f253b;
  --co-shadow-color:rgb(0 0 0 / 0.55);
}}
@media (prefers-reduced-motion:reduce){:root{
  --co-dur-page:160ms;--co-dur-reveal:200ms;--co-dur-sequence:0ms;--co-stagger:0ms;--co-rise:0px;--co-reveal-blur:0px;
}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--co-bg);color:var(--co-ink);font:400 var(--co-text-sm)/1.5 var(--co-font-sans);
  -webkit-font-smoothing:antialiased;caret-color:var(--co-accent)}
::selection{background:var(--co-accent-soft)}
:focus-visible{outline:2px solid transparent;box-shadow:var(--co-focus-ring)}
code,.id,.mono{font-family:var(--co-font-mono)}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}

/* Header */
header.top{position:sticky;top:0;z-index:5;background:var(--co-bg);
  background:color-mix(in srgb,var(--co-bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.head-in{max-width:1500px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{flex:none;height:26px;overflow:hidden}
.brand svg{display:block;height:26px;width:auto}
.brand .co-ink{stroke:var(--co-ink)}.brand .co-accent{stroke:var(--co-accent)}.brand .co-word{fill:var(--co-ink)}
.rule{flex:none;width:1px;height:30px;background:var(--co-line)}
.title{flex:1;min-width:0}
.title h1{margin:0;font-size:var(--co-text-md);font-weight:var(--co-weight-strong);letter-spacing:var(--co-tracking-heading);
  line-height:var(--co-leading-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin-top:3px;color:var(--co-muted);font-size:var(--co-text-xs);overflow-wrap:anywhere}
.sub code{font-size:.92em;color:var(--co-ink-2)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.progress{height:2px;background:var(--co-line)}
.progress>div{height:100%;width:0;background:var(--co-accent);transition:width var(--co-dur-reveal) var(--co-ease-arrive)}

/* The signature move: rows draw in, outer first, then the violet centre, then the text sharpens */
.brand .co-row1,.brand .co-row2,.brand .co-row3{stroke-dasharray:1;animation:co-draw var(--co-dur-reveal) var(--co-ease-arrive) backwards}
.brand .co-row2{animation-delay:var(--co-stagger)}
.brand .co-row3{animation-delay:calc(var(--co-stagger) * 3)}
.brand .co-word{animation:co-fade var(--co-dur-reveal) var(--co-ease-arrive) calc(var(--co-stagger) * 4) backwards}
.title{animation:co-sharpen var(--co-dur-reveal) var(--co-ease-arrive) calc(var(--co-stagger) * 5) backwards}
@keyframes co-draw{from{stroke-dashoffset:1}}
@keyframes co-sharpen{from{opacity:0;filter:blur(var(--co-reveal-blur));transform:translateY(var(--co-rise))}}
@keyframes co-fade{from{opacity:0}}
@keyframes co-up{from{opacity:0;transform:translateY(8px)}}

/* Status */
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:var(--co-radius-pill);
  background:var(--co-sunken);color:var(--co-ink-2);font-size:0.75rem;font-weight:600;white-space:nowrap;
  transition:background-color var(--co-dur-base) var(--co-ease-move),color var(--co-dur-base) var(--co-ease-move)}
.pill::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.sm{height:22px;padding:0 8px;gap:6px}
.s-running,.s-planning,.s-in_progress,.s-review{background:var(--co-info-soft);color:var(--co-info)}
.s-waiting_on_you{background:var(--co-warn-soft);color:var(--co-warn)}
.s-finished,.s-planned,.s-done{background:var(--co-ok-soft);color:var(--co-ok)}
.s-audit{background:var(--co-sunken);color:var(--co-ink)}
.s-paused,.s-skipped,.s-queue{background:var(--co-sunken);color:var(--co-muted)}
.flash{animation:co-fade var(--co-dur-base) var(--co-ease-arrive)}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;
  border:1px solid var(--co-line-strong);border-radius:var(--co-radius-md);background:var(--co-surface);color:var(--co-ink);
  font:600 var(--co-text-sm)/1 var(--co-font-sans);text-decoration:none;white-space:nowrap;cursor:pointer;
  transition:background-color var(--co-dur-quick) var(--co-ease-arrive),border-color var(--co-dur-quick) var(--co-ease-arrive),
    color var(--co-dur-quick) var(--co-ease-arrive),transform var(--co-dur-instant) var(--co-ease-arrive)}
.btn:hover{border-color:var(--co-muted);background:var(--co-sunken)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--co-accent);border-color:var(--co-accent);color:var(--co-on-accent)}
.btn.primary:hover{background:var(--co-accent-strong);border-color:var(--co-accent-strong)}
.btn.pr{background:var(--co-accent-soft);border-color:transparent;color:var(--co-accent-strong);animation:co-up var(--co-dur-page) var(--co-ease-arrive)}
.btn.pr:hover{border-color:var(--co-accent)}
.btn svg{flex:none;transition:transform var(--co-dur-quick) var(--co-ease-arrive)}
.btn.pr:hover svg{transform:translate(2px,-2px)}
.btn.icon{width:34px;padding:0}
textarea{display:block;width:100%;min-height:76px;padding:10px 12px;border:1px solid var(--co-muted);border-radius:var(--co-radius-md);
  background:var(--co-surface);color:var(--co-ink);font:inherit;resize:vertical;transition:border-color var(--co-dur-quick) var(--co-ease-arrive)}
textarea:focus{border-color:var(--co-accent)}
textarea::placeholder{color:var(--co-muted)}

/* Layout */
main{max-width:1500px;margin:0 auto;padding:22px 24px 72px}
.stats{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0 0 22px;color:var(--co-muted);font-size:var(--co-text-xs)}
.stats div{display:flex;align-items:baseline;gap:6px}
.stats b{color:var(--co-ink);font-size:var(--co-text-md);font-weight:var(--co-weight-strong);letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.card{background:var(--co-surface);border:1px solid var(--co-line);border-radius:var(--co-radius-lg);box-shadow:var(--co-shadow-1)}
.enter{animation:co-up var(--co-dur-page) var(--co-ease-arrive) backwards}
.view-in{animation:co-up var(--co-dur-page) var(--co-ease-arrive)}
.fade{animation:co-fade var(--co-dur-base) var(--co-ease-arrive)}
.empty{color:var(--co-muted);font-size:var(--co-text-xs)}

/* Waiting on you: one list of what only the owner can do. It eases open, and folds away once empty. */
.alerts{display:grid;gap:12px}
.alerts:not(:empty){margin-bottom:16px}
.w-in{padding-bottom:28px}
.w-title{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:var(--co-text-base);font-weight:var(--co-weight-strong);letter-spacing:-0.01em}
.w-title:focus{outline:none}
.attention{display:grid;gap:12px}
.w-kind{display:inline-block;margin:0 0 8px;padding:1px 7px;border-radius:var(--co-radius-sm);background:var(--co-warn-soft);color:var(--co-warn);
  font-size:0.75rem;font-weight:600;line-height:1.5}
.notice.bad .w-kind{background:var(--co-bad-soft);color:var(--co-bad)}
.notice .w-kind+h3{margin-top:0}
.w-files{margin:0 0 4px;padding-left:18px;color:var(--co-ink-2)}
.w-files li{margin:3px 0;overflow-wrap:anywhere}
.btn.waits{background:var(--co-warn-soft);border-color:transparent;color:var(--co-warn);animation:co-up var(--co-dur-page) var(--co-ease-arrive)}
.btn.waits:hover{border-color:var(--co-warn)}
.w-n{font-variant-numeric:tabular-nums}
.notice{position:relative;overflow:hidden;padding:16px 18px 16px 21px}
.notice::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--co-warn)}
.notice.bad::before{background:var(--co-bad)}
.notice h3{margin:0 0 4px;font-size:var(--co-text-base);font-weight:var(--co-weight-strong);letter-spacing:-0.01em}
.notice h3 .id{margin-right:6px;font-size:.85em;color:var(--co-ink-2)}
.notice p{margin:0 0 12px;max-width:var(--co-measure);color:var(--co-ink-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* The plan's short version: sections reveal in order once, each question settles on its own */
.plan-card .pc{display:grid;gap:22px;max-width:820px;margin-top:18px}
.pc-sec{animation:co-up var(--co-dur-page) var(--co-ease-arrive) backwards;animation-delay:calc(var(--i,0) * var(--co-stagger) + 120ms)}
.pc h4{margin:0 0 8px;color:var(--co-muted);font-size:0.75rem;font-weight:var(--co-weight-strong);letter-spacing:.01em}
.pc .md{font-size:var(--co-text-sm)}
.pc .md>:last-child{margin-bottom:0}
.pc .waves{margin:0}
.pc-out{padding:12px 16px 12px 14px;border-radius:var(--co-radius-md);background:var(--co-warn-soft)}
.pc-out h4{color:var(--co-warn)}
.pc-out ul{margin:0;padding-left:18px}
.pc-out li{margin:4px 0;line-height:1.5}
.pc-out code{padding:1px 5px;border-radius:5px;background:color-mix(in srgb,var(--co-surface) 60%,transparent);font-size:.86em}
.pc-when{color:var(--co-warn);font-weight:600}
.qs{display:grid;gap:10px}
.q{padding:12px 14px;border:1px solid var(--co-line);border-radius:var(--co-radius-md);
  transition:background-color var(--co-dur-base) var(--co-ease-move),border-color var(--co-dur-base) var(--co-ease-move)}
.q.settled,.q.fixed{background:var(--co-sunken)}
.q-head{display:flex;align-items:baseline;gap:10px}
.q-n{flex:none;min-width:12px;color:var(--co-muted);font:600 0.75rem var(--co-font-mono)}
.q-text{min-width:0;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.q-text code,.q-label code,.q-ans code{padding:1px 5px;border-radius:5px;background:var(--co-sunken);font-size:.86em}
.q-body,.q-done{margin:10px 0 0 22px}
.q-opts{display:grid;gap:6px;margin:0;padding:0;border:0}
.q-opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--co-line);border-radius:var(--co-radius-sm);
  cursor:pointer;line-height:1.45;transition:border-color var(--co-dur-quick) var(--co-ease-arrive),background-color var(--co-dur-quick) var(--co-ease-arrive)}
.q-opt:hover{border-color:var(--co-line-strong)}
.q-opt input{position:absolute;width:1px;height:1px;margin:0;opacity:0}
.q-opt:has(input:checked){border-color:var(--co-accent);background:var(--co-accent-soft)}
.q-dot{flex:none;width:14px;height:14px;margin-top:3px;border:1.5px solid var(--co-muted);border-radius:50%;
  transition:border-width var(--co-dur-quick) var(--co-ease-arrive),border-color var(--co-dur-quick) var(--co-ease-arrive)}
.q-opt input:checked~.q-dot{border:4.5px solid var(--co-accent)}
.q-opt input:focus-visible~.q-dot{outline:2px solid transparent;box-shadow:var(--co-focus-ring)}
.q-label{flex:1;min-width:0;overflow-wrap:anywhere}
.q-def{flex:none;padding:1px 7px;border-radius:var(--co-radius-sm);background:var(--co-sunken);color:var(--co-ink-2);font-size:0.75rem;font-weight:600;line-height:1.5}
.q-own{margin-top:8px;min-height:60px}
.q-acts{margin-top:10px}
.q-done{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.q-ans{flex:1;min-width:0;color:var(--co-ink-2);overflow-wrap:anywhere}
.q:not(.settled):not(.fixed) .q-done,.q.settled .q-body{display:none}
.btn.sm{height:30px;padding:0 12px;font-size:var(--co-text-xs)}
.settle-in{animation:co-up var(--co-dur-base) var(--co-ease-arrive)}
.pc-label{display:block;margin:0 0 8px;color:var(--co-muted);font-size:0.75rem;font-weight:var(--co-weight-strong)}
.pc-label span{font-weight:400}
.pc-hint{align-self:center;color:var(--co-muted);font-size:var(--co-text-xs)}

/* Tabs */
.tabs{position:relative;display:flex;gap:2px;margin-bottom:20px;border-bottom:1px solid var(--co-line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:12px 12px 13px;border:0;border-radius:var(--co-radius-sm) var(--co-radius-sm) 0 0;background:none;
  color:var(--co-muted);font:600 var(--co-text-sm)/1 var(--co-font-sans);cursor:pointer;transition:color var(--co-dur-quick) var(--co-ease-arrive)}
.tabs button:hover,.tabs button.on{color:var(--co-ink)}
.tabs::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--w,0);transform:translateX(var(--x,0));
  border-radius:2px;background:var(--co-accent);pointer-events:none}
.tabs.ready::after{transition:transform var(--co-dur-base) var(--co-ease-move),width var(--co-dur-base) var(--co-ease-move)}

/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start}
.col{padding:10px;background:var(--co-sunken);border:1px solid var(--co-line);border-radius:var(--co-radius-lg)}
.col-h{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 10px;font-size:var(--co-text-sm);font-weight:var(--co-weight-strong)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border:1px solid var(--co-line);
  border-radius:var(--co-radius-pill);background:var(--co-surface);color:var(--co-ink-2);font-size:0.75rem;font-variant-numeric:tabular-nums}
.list{display:grid;gap:8px;min-height:38px}
.list:empty::before{content:"None";padding:9px 6px;color:var(--co-muted);font-size:var(--co-text-xs)}
.task{padding:12px 13px;border-radius:var(--co-radius-md);cursor:pointer;
  transition:border-color var(--co-dur-quick) var(--co-ease-arrive),box-shadow var(--co-dur-quick) var(--co-ease-arrive),transform var(--co-dur-quick) var(--co-ease-arrive)}
.task:hover{border-color:var(--co-line-strong);box-shadow:var(--co-shadow-2);transform:translateY(-1px)}
.task.sel{border-color:var(--co-accent)}
.task .top{display:flex;align-items:center;gap:8px;color:var(--co-muted);font-size:0.75rem}
.task .id{color:var(--co-ink);font-size:0.75rem;font-weight:600}
.task .t{margin:5px 0 10px;font-weight:600;line-height:1.4;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:5px;color:var(--co-muted);font-size:0.75rem}
.meta>span:not(.pill){padding:2px 7px;border-radius:var(--co-radius-sm);background:var(--co-sunken);font-variant-numeric:tabular-nums}

/* Plan and request */
.plan{max-width:960px;padding:28px 32px}
.waves{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;margin:0 0 28px}
.waves:empty{display:none}
.wave{min-width:170px;padding:12px 14px;border:1px solid var(--co-line);border-radius:var(--co-radius-md);background:var(--co-sunken)}
.wave b{display:block;margin-bottom:6px;color:var(--co-muted);font-size:0.75rem;font-weight:var(--co-weight-strong)}
.wave div{font-size:var(--co-text-xs);line-height:1.5}
.wave .id{font-size:0.75rem;font-weight:600}
.arrow{align-self:center;color:var(--co-muted)}
.reports h2{margin:32px 0 10px}
.report{margin:10px 0;overflow:hidden;border-radius:var(--co-radius-md);box-shadow:none}
.report summary{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;list-style:none;font:500 var(--co-text-xs) var(--co-font-mono)}
.report summary::-webkit-details-marker{display:none}
.report summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--co-muted);border-bottom:1.5px solid var(--co-muted);
  transform:rotate(45deg) translateY(-2px);transition:transform var(--co-dur-base) var(--co-ease-move)}
.report[open] summary::after{transform:rotate(225deg) translateY(-2px)}
.report[open] .md{animation:co-fade var(--co-dur-base) var(--co-ease-arrive)}
.report .md{padding:0 18px 14px}
.request{max-width:960px;padding:24px 28px;font-size:var(--co-text-base);line-height:var(--co-leading-body);white-space:pre-wrap}
.note{margin-top:16px;padding-top:14px;border-top:1px solid var(--co-line)}

/* Markdown */
.md{font-size:var(--co-text-base);line-height:var(--co-leading-body)}
.md>*{max-width:var(--co-measure)}
.md>table,.md>pre{max-width:none}
.md h1,.md h2,.md h3,.md h4{font-weight:var(--co-weight-strong);letter-spacing:var(--co-tracking-heading);line-height:var(--co-leading-heading)}
.md h1{margin:0 0 14px;font-size:var(--co-text-lg)}.md h2{margin:28px 0 8px;font-size:var(--co-text-md)}
.md h3,.md h4{margin:20px 0 6px;font-size:var(--co-text-base)}
.md p{margin:0 0 12px}.md ul,.md ol{margin:0 0 12px;padding-left:22px}.md li{margin:3px 0}
.md table{width:100%;margin:10px 0 16px;border-collapse:collapse;font-size:var(--co-text-sm);font-variant-numeric:tabular-nums}
.md th,.md td{padding:7px 10px;border-bottom:1px solid var(--co-line);text-align:left;vertical-align:top}
.md th{border-bottom-color:var(--co-line-strong);font-weight:var(--co-weight-strong)}
.md code{padding:1px 5px;border-radius:5px;background:var(--co-sunken);font-size:.86em}
.md pre{overflow:auto;padding:12px 14px;border:1px solid var(--co-line);border-radius:var(--co-radius-md);background:var(--co-sunken);font-size:var(--co-text-xs)}
.md pre code{padding:0;background:none;font-size:inherit}
.md blockquote{margin:10px 0;padding:2px 14px;border-left:3px solid var(--co-line-strong);color:var(--co-ink-2)}
.md a{color:var(--co-accent);text-underline-offset:3px}
.md a:hover{color:var(--co-accent-strong)}

/* Drawer: slow to arrive, quick to leave */
aside{position:fixed;top:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;width:min(760px,100vw);
  background:var(--co-surface);border-left:1px solid var(--co-line);box-shadow:var(--co-shadow-2);
  transform:translateX(104%);visibility:hidden;transition:transform var(--co-dur-quick) var(--co-ease-leave),visibility 0s linear var(--co-dur-quick)}
aside.open{transform:none;visibility:visible;transition:transform var(--co-dur-base) var(--co-ease-arrive)}
.d-head{display:flex;align-items:flex-start;gap:12px;padding:20px 24px 14px}
.d-head .grow{flex:1;min-width:0}
.d-id{color:var(--co-muted);font:600 0.75rem var(--co-font-mono)}
.d-head h2{margin:4px 0 10px;font-size:var(--co-text-lg);font-weight:var(--co-weight-strong);letter-spacing:var(--co-tracking-heading);line-height:var(--co-leading-heading)}
#d-tabs{margin:0;padding:0 24px}
#d-tabs button{font:500 var(--co-text-xs)/1 var(--co-font-mono)}
.d-body{flex:1;overflow:auto;padding:20px 24px 40px}

/* Conversation: the agent's words in the reading face, its tool calls and results quiet and in mono */
.c-pick{position:sticky;top:-20px;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-20px -24px 18px;padding:12px 24px;
  background:var(--co-surface);background:color-mix(in srgb,var(--co-surface) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--co-line)}
.c-pick:empty{display:none}
.c-pick button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border:1px solid var(--co-line);border-radius:var(--co-radius-pill);
  background:var(--co-surface);color:var(--co-ink-2);font:600 0.75rem/1 var(--co-font-sans);white-space:nowrap;cursor:pointer;
  transition:background-color var(--co-dur-quick) var(--co-ease-arrive),border-color var(--co-dur-quick) var(--co-ease-arrive),color var(--co-dur-quick) var(--co-ease-arrive)}
.c-pick button:hover{border-color:var(--co-line-strong);color:var(--co-ink)}
.c-pick button.on{border-color:var(--co-accent);background:var(--co-accent-soft);color:var(--co-accent-strong)}
.c-pick button.sub{padding-left:10px}
.c-pick button.sub::before{content:"";flex:none;width:6px;height:6px;margin-top:-4px;border-left:1.5px solid var(--co-muted);border-bottom:1.5px solid var(--co-muted);border-bottom-left-radius:2px}
.c-live{display:inline-flex;align-items:center;gap:5px;margin-right:-6px;padding:0 7px;height:18px;border-radius:var(--co-radius-pill);
  background:var(--co-info-soft);color:var(--co-info);font-weight:600}
.c-live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-log{display:grid;gap:10px;min-width:0}
.c-log>*,.c-call>*{min-width:0}
.c-call{display:grid;gap:10px}
.c-say{max-width:var(--co-measure);font-size:var(--co-text-sm);line-height:var(--co-leading-body);margin:6px 0 2px}
.c-say>:last-child{margin-bottom:0}
.c-say h1,.c-say h2,.c-say h3,.c-say h4{margin:12px 0 6px;font-size:var(--co-text-base)}
.c-tool{display:flex;align-items:baseline;gap:9px;padding:6px 10px;border-radius:var(--co-radius-sm);background:var(--co-sunken);
  font:var(--co-text-xs)/1.45 var(--co-font-mono)}
.c-tool b{flex:none;color:var(--co-ink);font-weight:600}
.c-arg{min-width:0;overflow:hidden;color:var(--co-ink-2);white-space:nowrap;text-overflow:ellipsis}
.c-res{margin:-4px 0 0 10px;padding:2px 0 2px 12px;border-left:2px solid var(--co-line)}
.c-res.err{border-left-color:var(--co-bad)}
.c-res pre,.c-full{margin:0;color:var(--co-muted);font:var(--co-text-xs)/1.5 var(--co-font-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.c-res details>summary,.c-prompt>summary{display:flex;align-items:center;gap:8px;min-width:0;padding:3px 0;color:var(--co-muted);
  font-size:0.75rem;font-weight:600;cursor:pointer;list-style:none;transition:color var(--co-dur-quick) var(--co-ease-arrive)}
.c-res details>summary::-webkit-details-marker,.c-prompt>summary::-webkit-details-marker{display:none}
.c-res details>summary:hover,.c-prompt>summary:hover{color:var(--co-ink)}
.c-res details>summary::after,.c-prompt>summary::before{content:"";flex:none;width:6px;height:6px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform var(--co-dur-base) var(--co-ease-move)}
.c-res details[open]>summary::after,.c-prompt[open]>summary::before{transform:rotate(45deg)}
.c-res details[open]>pre,.c-prompt[open]>.c-full{animation:co-fade var(--co-dur-base) var(--co-ease-arrive)}
.c-tag{display:inline-block;margin:2px 8px 2px 0;padding:1px 7px;border-radius:var(--co-radius-sm);background:var(--co-sunken);
  color:var(--co-ink-2);font:600 0.75rem/1.4 var(--co-font-sans)}
.c-tag.bad{background:var(--co-bad-soft);color:var(--co-bad)}
.c-prompt{padding:8px 12px;border:1px solid var(--co-line);border-radius:var(--co-radius-md)}
.c-prompt>summary .c-tag{margin:0}
.c-first{min-width:0;overflow:hidden;color:var(--co-ink-2);font-weight:500;white-space:nowrap;text-overflow:ellipsis}
.c-prompt .c-full{padding:8px 0 4px}

/* Paths that open in the viewer: a quiet dotted underline, violet when pointed at */
[data-path]{cursor:pointer;text-decoration:underline dotted var(--co-line-strong);text-underline-offset:3px;
  transition:color var(--co-dur-quick) var(--co-ease-arrive),background-color var(--co-dur-quick) var(--co-ease-arrive),text-decoration-color var(--co-dur-quick) var(--co-ease-arrive)}
[data-path]:hover{color:var(--co-accent-strong);text-decoration-color:var(--co-accent)}
.md code[data-path]:hover{background:var(--co-accent-soft)}
.c-arg[data-path]{border-radius:3px}

/* The task folder's files */
.f-list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.f-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:var(--co-radius-md);background:none;
  color:var(--co-ink);font:500 var(--co-text-sm)/1.35 var(--co-font-sans);text-align:left;cursor:pointer;
  transition:background-color var(--co-dur-quick) var(--co-ease-arrive)}
.f-item:hover{background:var(--co-sunken)}
.f-ext{flex:none;width:44px;padding:3px 0;border-radius:var(--co-radius-sm);background:var(--co-sunken);color:var(--co-ink-2);
  font:600 0.6875rem/1.3 var(--co-font-mono);text-align:center;text-transform:uppercase;transition:background-color var(--co-dur-quick) var(--co-ease-arrive)}
.f-item:hover .f-ext{background:var(--co-surface)}
.f-name{flex:1;min-width:0;font-family:var(--co-font-mono);font-size:var(--co-text-xs);overflow-wrap:anywhere}
.f-size{flex:none;color:var(--co-muted);font-size:0.75rem;font-variant-numeric:tabular-nums}

/* File viewer: a modal over the page, slow to arrive, quick to leave */
.viewer{position:fixed;inset:0;z-index:20;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;padding:28px;visibility:hidden;transition:visibility 0s linear var(--co-dur-quick)}
.viewer.open{visibility:visible;transition:none}
.v-back{position:absolute;inset:0;background:color-mix(in srgb,var(--co-bg) 64%,transparent);
  -webkit-backdrop-filter:saturate(1.2) blur(6px);backdrop-filter:saturate(1.2) blur(6px);opacity:0;transition:opacity var(--co-dur-quick) var(--co-ease-leave)}
.viewer.open .v-back{opacity:1;transition:opacity var(--co-dur-base) var(--co-ease-arrive)}
.v-panel{position:relative;display:flex;flex-direction:column;width:min(1120px,100%);max-height:100%;min-height:0;
  background:var(--co-surface);border:1px solid var(--co-line);border-radius:var(--co-radius-lg);box-shadow:var(--co-shadow-2);
  opacity:0;transform:translateY(var(--co-rise)) scale(.98);
  transition:opacity var(--co-dur-quick) var(--co-ease-leave),transform var(--co-dur-quick) var(--co-ease-leave)}
.viewer.open .v-panel{opacity:1;transform:none;transition:opacity var(--co-dur-base) var(--co-ease-arrive),transform var(--co-dur-page) var(--co-ease-arrive)}
.v-head{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px 22px;border-bottom:1px solid var(--co-line)}
.v-head .grow{flex:1;min-width:0}
.v-head h2{margin:0;font-size:var(--co-text-base);font-weight:var(--co-weight-strong);letter-spacing:-0.01em;line-height:var(--co-leading-heading);overflow-wrap:anywhere}
.v-meta{margin-top:5px;color:var(--co-muted);font:var(--co-text-xs)/1.45 var(--co-font-mono);overflow-wrap:anywhere}
.v-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 22px 28px;border-radius:0 0 var(--co-radius-lg) var(--co-radius-lg)}
.v-body.img{display:grid;place-items:center;padding:18px;background:var(--co-sunken)}
.v-img{display:block;max-width:100%;max-height:calc(100vh - 190px);height:auto;border-radius:var(--co-radius-sm);opacity:0;
  transition:opacity var(--co-dur-base) var(--co-ease-arrive)}
.v-img.ready{opacity:1}
.v-code{width:max-content;min-width:100%;margin:0;font:var(--co-text-xs)/1.65 var(--co-font-mono);white-space:pre;tab-size:4;counter-reset:ln}
.v-code>span{display:block;position:relative;min-height:1.65em;padding-left:5em}
.v-code>span::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:3.6em;color:var(--co-muted);text-align:right;
  -webkit-user-select:none;user-select:none}
.v-none{display:grid;gap:4px;justify-items:center;padding:48px 16px;text-align:center}
.v-none b{font-size:var(--co-text-base);font-weight:var(--co-weight-strong)}
.v-none span{color:var(--co-muted);font-size:var(--co-text-xs)}

@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .head-in{padding:12px 16px;gap:10px 12px}
  .brand{width:28px}
  .rule{display:none}
  .actions{flex-basis:100%;gap:6px}
  .btn{height:32px;padding:0 11px}
  main{padding:18px 16px 56px}
  .board{grid-template-columns:1fr}
  .plan,.request{padding:20px}
  .d-head{padding:16px 16px 12px}#d-tabs{padding:0 16px}.d-body{padding:16px 16px 32px}
  .c-pick{top:-16px;margin:-16px -16px 16px;padding:10px 16px}
  .c-res{margin-left:4px;padding-left:10px}
  .viewer{padding:12px}
  .v-head{padding:14px 12px 12px 16px}.v-body{padding:16px 16px 24px}.v-body.img{padding:12px}
  .v-img{max-height:calc(100vh - 150px)}
}
/* Reduced motion: no keyframed movement, short fades at most */
@media (prefers-reduced-motion:reduce){
  .brand .co-row1,.brand .co-row2,.brand .co-row3{animation:none}
  .title,.enter,.view-in,.btn.pr,.btn.waits,.pc-sec,.settle-in{animation-name:co-fade}
  .task:hover,.btn:active{transform:none}
  .btn.pr:hover svg{transform:none}
  .tabs.ready::after{transition:none}
  .c-res details>summary::after,.c-prompt>summary::before{transition:none}
  aside{transform:none;opacity:0;transition:opacity var(--co-dur-quick) linear,visibility 0s linear var(--co-dur-quick)}
  aside.open{opacity:1;transition:opacity var(--co-dur-quick) linear}
  .v-panel,.viewer.open .v-panel{transform:none;transition:opacity var(--co-dur-quick) linear}
}
</style>

    <button data-tab="request" role="tab" aria-selected="false">Request</button>
  </div>
  <section id="tab-board"><div class="board" id="board"></div></section>
  <section id="tab-plan" hidden><div class="card plan"><div class="waves" id="waves"></div><div class="md" id="plan"></div><div class="reports" id="audits"></div></div></section>
  <section id="tab-request" hidden><div class="card request" id="request"></div></section>
</main>
<aside id="drawer" aria-labelledby="d-title">
  <div class="d-head">
    <div class="grow"><div class="d-id" id="d-id"></div><h2 id="d-title"></h2><div class="meta" id="d-meta"></div></div>
    <button class="btn icon" id="d-close" aria-label="Close">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </div>
  <div class="tabs" id="d-tabs" role="tablist" aria-label="Task files"></div>
  <div class="d-body md" id="d-body"></div>
</aside>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-title">
  <div class="v-back" id="v-back"></div>
  <div class="v-panel">
    <div class="v-head">
      <div class="grow"><h2 id="v-title"></h2><div class="v-meta" id="v-meta"></div></div>
      <button class="btn icon" id="v-close" aria-label="Close the file">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    </div>
    <div class="v-body" id="v-body" tabindex="0"></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const token = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ms = (n) => parseFloat(token(n)) || 0;
const COLS = [["queue","Queued",["queue"]],["work","Working",["in_progress","review"]],["audit","Officer check",["audit"]],
              ["you","Waiting on you",["waiting_on_you","paused"]],["done","Done",["done","skipped"]]];
const LABEL = {queue:"queued",in_progress:"building",review:"in review",audit:"officer check",waiting_on_you:"waiting on you",
               paused:"paused",done:"done",skipped:"skipped",running:"running",planning:"planning",finished:"finished",planned:"planned"};
let state = null, drawer = null, drawerFile = null, typing = false, opener = null;

function fmtTok(n){ n = n||0; return n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"K" : String(n); }
function fmtMin(m){ m = Math.round(m||0); return m >= 60 ? Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m" : m+"m"; }
function since(iso){ if(!iso) return ""; const s = (Date.now()-Date.parse(iso))/1000; return s < 90 ? Math.round(s)+"s" : s < 5400 ? Math.round(s/60)+"m" : (s/3600).toFixed(1)+"h"; }

function inline(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const lines = esc(src||"").split("\n"); let out = [], i = 0;
  while(i < lines.length){
    let l = lines[i];
    if(/^```/.test(l)){ const buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push("<pre><code>"+buf.join("\n")+"</code></pre>"); continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if(h){ out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^\s*\|/.test(l) && i+1<lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const row = (r) => r.trim().replace(/^\||\|$/g,"").split("|").map((c)=>inline(c.trim()));
      const head = row(l); i += 2; const body = [];
      while(i<lines.length && /^\s*\|/.test(lines[i])) body.push(row(lines[i++]));
      out.push("<table><thead><tr>"+head.map((c)=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"+body.map((r)=>"<tr>"+r.map((c)=>"<td>"+c+"</td>").join("")+"</tr>").join("")+"</tbody></table>"); continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while(i<lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))){
        if(/^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s{3,}/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/,""));
        else items[items.length-1] += "<br>" + lines[i].trim().replace(/^([-*]|\d+\.)\s+/,"• ");
        i++; }
      out.push((ordered?"<ol>":"<ul>")+items.map((x)=>"<li>"+inline(x)+"</li>").join("")+(ordered?"</ol>":"</ul>")); continue; }
    if(/^&gt;\s?/.test(l)){ const buf=[]; while(i<lines.length && /^&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^&gt;\s?/,"")); out.push("<blockquote>"+inline(buf.join(" "))+"</blockquote>"); continue; }
    if(!l.trim()){ i++; continue; }
    const buf=[]; while(i<lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+\.)\s|\s*\||&gt;)/.test(lines[i])) buf.push(lines[i++]);
    if(!buf.length) buf.push(lines[i++]);
    out.push("<p>"+inline(buf.join(" "))+"</p>");
  }
  return out.join("");
}

// Rendering helpers: write only what changed, so refreshes don't flicker or replay motion.
function setHTML(el, html){ if(el._html !== html){ el.innerHTML = html; el._html = html; } }
function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// Keyed lists: items [{key, parent, cls, html, attrs}] in order. New items enter, gone items fade out,
// and items that moved (for example between board columns) glide from their old place. `gone(el)` takes an item
// once it has faded; by default it is removed.
const pools = {};
function sync(name, items, gone){
  const pool = pools[name] ||= new Map(), motion = !reduce.matches, before = new Map(), keep = new Set(), at = new Map();
  if(motion) pool.forEach((el,k)=>before.set(k, el.getBoundingClientRect()));
  let fresh = 0;
  items.forEach((it)=>{
    keep.add(it.key);
    let el = pool.get(it.key);
    if(!el){
      el = document.createElement("div"); el.dataset.key = it.key; pool.set(it.key, el);
      Object.entries(it.attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));
      el._entering = true; el.style.animationDelay = reduce.matches ? "" : Math.min(fresh++ * ms("--co-stagger"), 400)+"ms";
      el.addEventListener("animationend",(e)=>{ if(e.target===el){ el._entering = false; el.classList.remove("enter"); el.style.animationDelay = ""; } });
    }
    setHTML(el, it.html);
    const cls = it.cls + (el._entering ? " enter" : ""); if(el.className !== cls) el.className = cls;
    const kids = [...it.parent.children].filter((c)=>c.dataset.key && !c._leaving), i = at.get(it.parent) || 0;
    at.set(it.parent, i+1);
    if(kids[i] !== el) it.parent.insertBefore(el, kids[i] || null);
  });
  pool.forEach((el,k)=>{ if(!keep.has(k)){ pool.delete(k); leave(el, gone); } });
  if(motion) pool.forEach((el,k)=>{
    const a = before.get(k); if(!a || !a.width) return;
    const b = el.getBoundingClientRect(), dx = a.left-b.left, dy = a.top-b.top;
    if(Math.abs(dx)+Math.abs(dy) > 1) el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"none"}],{duration:ms("--co-dur-page"),easing:token("--co-ease-move")});
  });
}
function leave(el, gone){
  el._leaving = true;
  el.animate([{opacity:1},{opacity:0,transform:reduce.matches?"none":"translateY(-4px)"}],{duration:ms("--co-dur-quick"),easing:token("--co-ease-leave"),fill:"forwards"}).onfinish = () => gone ? gone(el) : el.remove();
}
// The tab underline slides to the selected tab.
function placeBar(tabs, instant){
  const on = tabs.querySelector(".on");
  if(instant) tabs.classList.remove("ready");
  tabs.style.setProperty("--x", (on ? on.offsetLeft : 0)+"px"); tabs.style.setProperty("--w", (on ? on.offsetWidth : 0)+"px");
  if(instant){ void tabs.offsetWidth; tabs.classList.add("ready"); }
}

async function api(path, body){
  const r = await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({})); if(!r.ok) alertBox(j.error||"failed"); await refresh();
}
function alertBox(msg){ const n = document.createElement("div"); n.className="card notice bad enter"; n.setAttribute("role","alert"); n.textContent=msg; $("#alerts").prepend(n); setTimeout(()=>leave(n),6000); }
async function text(task, name){ const r = await fetch(`/api/file?${task?"task="+encodeURIComponent(task)+"&":""}name=${encodeURIComponent(name)}`); return r.ok ? r.text() : ""; }

function waves(tasks){
  const work = tasks.filter((t)=>["build","merge"].includes(t.type) && t.status!=="skipped");
  const by = Object.fromEntries(work.map((t)=>[t.id,t])); const lvl = {};
  const depth = (t, seen=new Set()) => { if(lvl[t.id]!=null) return lvl[t.id]; if(seen.has(t.id)) return 0; seen.add(t.id);
    const ds = t.depends_on.filter((d)=>by[d]).map((d)=>depth(by[d],seen)); return lvl[t.id] = ds.length ? Math.max(...ds)+1 : 0; };
  work.forEach((t)=>depth(t)); const groups = [];
  work.forEach((t)=>{ (groups[lvl[t.id]] ||= []).push(t); });
  return groups.map((g,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':""}<div class="wave"><b>${g.length>1?"In parallel":"Step"} ${i+1}</b>${g.map((t)=>`<div><span class="id">${esc(t.id)}</span> ${esc(t.title)}</div>`).join("")}</div>`).join("");
}

function card(t, a){
  return `<div class="top"><span class="id">${esc(t.id)}</span><span>${esc(t.type)}</span></div><div class="t">${esc(t.title)}</div><div class="meta">
    ${a?`<span class="pill sm s-in_progress">${esc(a.role)} · ${since(a.since)}</span>`:`<span class="pill sm s-${esc(t.status)}">${LABEL[t.status]||esc(t.status)}</span>`}
    ${t.model?`<span>${esc(t.model)}${t.effort?" · "+esc(t.effort):""}</span>`:""}${t.size&&t.type!=="plan"?`<span>${esc(t.size)}</span>`:""}
    ${t.depends_on.length?`<span>after ${esc(t.depends_on.join(", "))}</span>`:""}${t.tests?`<span>tests on</span>`:""}${t.audit_round?`<span>officer ×${t.audit_round}</span>`:""}
    ${t.tokens?`<span>${fmtTok(t.tokens)} · ${fmtMin(t.minutes)}</span>`:""}</div>`;
}

// The plan's short version, read from plan.md: goal, order, what this run leaves out, and each question to settle.
let planSrc = "", planQs = [], planPick = {}, planComment = "";
const planReady = (s) => (s.waiting||[]).some((w)=>w.kind==="plan");
const isNone = (l) => /^\(?none\.?\)?$/i.test(l.trim());
function planSection(src, name){
  const out = []; let on = false;
  (src||"").split("\n").forEach((l)=>{ if(/^##\s/.test(l)) on = l.slice(3).trim().toLowerCase()===name; else if(on) out.push(l); });
  return out.join("\n").trim();
}
// Items of a list section, with wrapped lines joined to their item.
function planItems(src, name, mark){
  const items = [];
  planSection(src, name).split("\n").forEach((l)=>{ const m = l.match(mark);
    if(m) items.push(m); else if(items.length && l.trim()) items[items.length-1][items[items.length-1].length-1] += " "+l.trim(); });
  return items;
}
// "1. <question> - options: <A> | <B> - default if unanswered: <A>"; other lines keep their default when one is named.
function planQuestions(src){
  const dash = "\\s+[-–—]\\s+";
  return planItems(src, "questions for the owner", /^\s*(\d+)[.)]\s+(.*)$/).filter((m)=>!isNone(m[2])).map(([,n,raw], i)=>{
    raw = raw.trim(); let m = raw.match(new RegExp("^(.*?)"+dash+"options:\\s*(.*?)"+dash+"default if unanswered:\\s*(.*)$","i"));
    if(m){ const opts = m[2].split(/\s+\|\s+/).map((x)=>x.trim()).filter(Boolean), d = m[3].trim();
      let def = opts.findIndex((o)=>o.toLowerCase()===d.toLowerCase()); if(def<0){ opts.unshift(d); def = 0; }
      return {k:String(i), n, q:m[1].trim(), opts, def}; }
    if((m = raw.match(new RegExp("^(.*?)"+dash+"answered:\\s*(.*)$","i")))) return {k:String(i), n, q:m[1].trim(), answered:m[2].trim()};
    if((m = raw.match(new RegExp("^(.*?)"+dash+"default(?: if unanswered)?:\\s*(.*)$","i")))) return {k:String(i), n, q:m[1].trim(), opts:[m[2].trim()], def:0};
    return {k:String(i), n, q:raw, opts:[], def:-1};
  });
}
function followupWhen(s, f){
  return f.status==="started" ? "started" : f.status==="failed" ? "failed to start" : f.status==="starting" ? "starting" : s.mode!=="build" ? "starts when the run builds" : "starts when you approve";
}
function qRow(q){
  const head = `<div class="q-head"><span class="q-n">${esc(q.n)}</span><div class="q-text" id="q-${q.k}">${inline(esc(q.q))}</div></div>`;
  if(q.answered!=null) return `<div class="q fixed" data-q="${q.k}">${head}<div class="q-done"><span class="pill sm s-done">Answered</span><span class="q-ans">${inline(esc(q.answered))}</span></div></div>`;
  const opt = (v, label) => `<label class="q-opt"><input type="radio" name="q${q.k}" value="${v}"${String(q.def)===v?" checked":""}><span class="q-dot" aria-hidden="true"></span><span class="q-label">${label}</span>${String(q.def)===v?'<span class="q-def">default</span>':""}</label>`;
  const opts = q.opts.length ? `<fieldset class="q-opts" aria-labelledby="q-${q.k}">${q.opts.map((o,i)=>opt(String(i), inline(esc(o)))).join("")}${opt("own","Your own answer")}</fieldset>` : "";
  return `<div class="q" data-q="${q.k}">${head}<div class="q-body">${opts}<textarea class="q-own" placeholder="Your answer…" aria-label="Your own answer to question ${esc(q.n)}"${q.opts.length?" hidden":""}></textarea>
    <div class="row q-acts"><button class="btn sm" data-settle="${q.k}">Settle</button></div></div>
    <div class="q-done"><span class="pill sm s-done">Settled</span><span class="q-ans"></span><button class="btn sm" data-unsettle="${q.k}" aria-label="Change the answer to question ${esc(q.n)}">Change</button></div></div>`;
}
function planCard(s){
  planQs = planQuestions(planSrc);
  const goal = planSection(planSrc, "goal"), order = waves(s.tasks), open = planQs.filter((q)=>q.answered==null).length;
  const out = planItems(planSrc, "not in this run", /^\s*[-*]\s+(.*)$/).map((m)=>m[1].trim()).filter((l)=>l && !isNone(l))
    .map((l)=>`<li>${inline(esc(l))}</li>`).concat((s.followups||[]).map((f)=>`<li><strong>${esc(String(f.repo||"").split("/").filter(Boolean).pop()||f.repo)}</strong>: ${inline(esc(f.note))} · <span class="pc-when">${followupWhen(s, f)}</span></li>`));
  let i = 0; const sec = (cls, html) => `<section class="pc-sec${cls?" "+cls:""}" style="--i:${i++}">${html}</section>`;
  return `<h3>The plan is ready for you</h3><p>The hallucination officer has checked it.${open?" Settle each question, or approve them all.":""}</p><div class="pc">` +
    (goal ? sec("", `<h4>Goal</h4><div class="md">${md(goal)}</div>`) : "") +
    (order ? sec("", `<h4>Order</h4><div class="waves">${order}</div>`) : "") +
    (out.length ? sec("pc-out", `<h4>Not in this run</h4><ul>${out.join("")}</ul>`) : "") +
    (planQs.length ? sec("", `<h4>Questions</h4><div class="qs">${planQs.map(qRow).join("")}</div>`) : "") +
    sec("", `<label class="pc-label" for="pc-comment">Your comment <span>(optional)</span></label><textarea id="pc-comment" data-plan-comment placeholder="Anything to change?"></textarea>
      <div class="row"><button class="btn primary" data-act="approve-plan">Approve</button><button class="btn primary" data-act="send-plan" hidden>Send changes</button><button class="btn" data-open-tab="plan">Read the full plan</button><span class="pc-hint" hidden>Changes go back to the planner, then to you.</span></div>`) + "</div>";
}
// A row's answer: its choice, or its own text. Null when "Your own answer" is picked but empty.
function planAnswer(q){
  const p = planPick[q.k] || {}, pick = p.pick ?? (q.def>=0 ? String(q.def) : "own"), own = (p.own||"").trim();
  if(pick==="own") return own ? {answer:own, default:false} : q.def<0 ? {answer:"no answer", default:true} : null;
  return {answer:q.opts[+pick], default:+pick===q.def};
}
function planButtons(el){
  const changed = !!planComment.trim() || planQs.some((q)=>{ if(q.answered!=null) return false; const a = planAnswer(q); return !a || !a.default; });
  el.querySelector('[data-act="approve-plan"]').hidden = changed;
  el.querySelector('[data-act="send-plan"]').hidden = !changed;
  el.querySelector(".pc-hint").hidden = !changed;
}
function showSettled(row, q){
  const a = planAnswer(q); row.classList.add("settled");
  setHTML(row.querySelector(".q-ans"), inline(esc(a.answer)) + (a.default && q.def>=0 ? ' <span class="q-def">default</span>' : ""));
}
// After the card is (re)built, put back what the owner already chose.
function applyPlan(el){
  planQs.forEach((q)=>{
    const p = planPick[q.k], row = el.querySelector(`.q[data-q="${q.k}"]`); if(!p || !row || q.answered!=null) return;
    const r = p.pick!=null && row.querySelector(`input[value="${CSS.escape(p.pick)}"]`); if(r) r.checked = true;
    const ta = row.querySelector(".q-own"); ta.value = p.own || ""; if(q.opts.length) ta.hidden = p.pick!=="own";
    if(p.settled && planAnswer(q)) showSettled(row, q);
  });
  el.querySelector("[data-plan-comment]").value = planComment;
  planButtons(el);
}
function settle(k, on){
  const el = pools.attention && pools.attention.get("plan"), q = planQs.find((x)=>x.k===k); if(!el || !q) return;
  const row = el.querySelector(`.q[data-q="${q.k}"]`), p = planPick[k] ||= {};
  if(on){
    if(!planAnswer(q)) return row.querySelector(".q-own").focus();
    p.settled = true; showSettled(row, q); replay(row.querySelector(".q-done"), "settle-in");
    row.querySelector("[data-unsettle]").focus({preventScroll:true});
  } else {
    p.settled = false; row.classList.remove("settled"); replay(row.querySelector(".q-body"), "settle-in");
    const c = row.querySelector("input:checked") || row.querySelector(".q-own"); if(c) c.focus({preventScroll:true});
  }
}
async function sendPlan(b){
  const el = pools.attention && pools.attention.get("plan"), answers = []; if(!el) return;
  for(const q of planQs){
    if(q.answered!=null) continue;
    const a = planAnswer(q);
    if(!a){ const row = el.querySelector(`.q[data-q="${q.k}"]`); if(row.classList.contains("settled")) settle(q.k, false); return row.querySelector(".q-own").focus(); }
    answers.push({n:q.n, question:q.q, answer:a.answer, default:a.default});
  }
  typing = false; b.disabled = true;
  try{ await api("/api/approve", {answers, comment:planComment.trim()}); } finally { b.disabled = false; }
}

// Each thing waiting on the owner (s.waiting, the same list `coord wait` prints) with its action in place.
const KIND = {plan:"Plan", question:"Question", officer:"Officer stalemate", stalled:"Stalled", scheduler:"Scheduler",
              followup:"Follow-up run", todo:"Manual step", pr:"Pull request", external:"Outside the repo"};
const OUT = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function waitItem(s, w){
  const kind = w.kind==="question" && w.question_kind!=="agent" ? w.question_kind : w.kind;
  const tag = `<span class="w-kind">${KIND[kind]||esc(kind)}${w.task?" · "+esc(w.task):""}</span>`;
  const link = (label) => `<div class="row"><a class="btn primary" href="${esc(w.url)}" target="_blank" rel="noopener" aria-label="${label} (opens in a new tab)">${label} ${OUT}</a></div>`;
  if(w.kind==="plan") return {cls:"card notice plan-card", html:tag+planCard(s)};
  if(w.kind==="question"){ const t = s.tasks.find((x)=>x.id===w.task) || {};
    return {cls:"card notice", html:tag+`<h3>${esc(w.title)}</h3><p>${esc(w.text)}</p><textarea data-answer="${esc(w.task)}" placeholder="Your answer…" aria-label="Your answer to ${esc(w.task)}"></textarea>
     <div class="row"><button class="btn primary" data-act="answer" data-task="${esc(w.task)}">Send answer</button>${w.question_kind==="officer"||t.type==="plan"?`<button class="btn" data-act="accept" data-task="${esc(w.task)}">Accept as it is</button>`:""}</div>`}; }
  if(w.kind==="scheduler") return {cls:"card notice bad", html:tag+`<h3>The scheduler is not running</h3><p>Nothing is being worked on. Resume to pick up where it stopped.</p><div class="row"><button class="btn primary" data-act="resume">Resume</button></div>`};
  if(w.kind==="followup") return w.url ? {cls:"card notice", html:tag+`<h3>${esc(w.text)}</h3><p>It plans in its own repo and waits for you there.</p>${link("Open its live page")}`}
    : {cls:"card notice"+(w.failed?" bad":""), html:tag+`<h3>${esc(w.text)}</h3><p>${w.failed?"Start it yourself from that repo with <code>/coordinate</code>.":inline(esc(w.do))}</p>`};
  if(w.kind==="todo") return {cls:"card notice", html:tag+`<p>${inline(esc(w.text))}</p><div class="row"><button class="btn primary" data-act="todo" data-n="${esc(w.n)}">Mark done</button></div>`};
  if(w.kind==="pr") return {cls:"card notice", html:tag+`<h3>${esc(w.text)}</h3><p>The run is finished.</p>${link("Open the pull request")}`};
  if(w.kind==="external") return {cls:"card notice", html:tag+`<h3>Commit the files updated outside the repo</h3><p>Coordinator doesn't commit them.</p><ul class="w-files">${(w.files||[]).map((f)=>`<li><code>${esc(f)}</code></li>`).join("")}</ul>`};
  return {cls:"card notice", html:tag+`<p>${esc(w.text)}</p>`};
}
// The panel eases between heights as items come and go, so the page below glides instead of jumping.
function fit(change){
  const box = $("#waiting"), from = box.hidden ? 0 : box.getBoundingClientRect().height, was = box._fit;
  box._fit = null; if(was) was.cancel();
  change();
  const show = $("#attention").childElementCount > 0;
  box.hidden = false; box.style.overflow = "";
  const to = show ? box.getBoundingClientRect().height : 0;
  if(reduce.matches || Math.abs(to-from) < 1){ box.hidden = !show; return; }
  box.style.overflow = "hidden";
  const a = box._fit = box.animate([{height:from+"px", opacity:from?1:0},{height:to+"px", opacity:to?1:0}],
    {duration:ms("--co-dur-base"), easing:token(from?"--co-ease-move":"--co-ease-arrive")});
  a.onfinish = () => { if(box._fit!==a) return; box._fit = null; box.style.overflow = ""; box.hidden = !show; };
}
function renderAttention(s){
  if(!planReady(s)){ planPick = {}; planComment = ""; }
  const parent = $("#attention");
  fit(()=>sync("attention", (s.waiting||[]).map((w)=>({key:w.key, parent, ...waitItem(s, w)})), (el)=>fit(()=>el.remove())));
  const pc = pools.attention.get("plan"); if(pc && pc._applied!==pc._html){ pc._applied = pc._html; applyPlan(pc); }
}

function renderBoard(s){
  const live = Object.values(s.agents||{}), items = [], shown = {};
  COLS.forEach(([key,,sts])=>{
    const col = $("#col-"+key), list = col.querySelector(".list"), ts = s.tasks.filter((t)=>sts.includes(t.status));
    col.querySelector(".count").textContent = ts.length;
    ts.forEach((t)=>{ shown[t.id] = t.status; items.push({key:t.id, parent:list, cls:"card task"+(drawer===t.id?" sel":""),
      attrs:{"data-task":t.id, tabindex:"0", role:"button"}, html:card(t, live.find((x)=>x.task===t.id))}); });
  });
  sync("board", items);
  pools.board.forEach((el,k)=>{ if(el._st && el._st !== shown[k]){ const p = el.querySelector(".pill"); if(p) replay(p,"flash"); } el._st = shown[k]; });
}

function render(s){
  const n = (s.waiting||[]).length;

  const pr = $("#pr"); pr.hidden = !s.pr_url; if(s.pr_url && pr.getAttribute("href")!==s.pr_url) pr.setAttribute("href", s.pr_url);
  const st = $("#status"), cls = "pill s-"+s.status; if(st.className !== cls) st.className = cls; st.textContent = LABEL[s.status] || s.status;

  const tok = s.tasks.reduce((a,t)=>a+(t.tokens||0),0), mins = s.tasks.reduce((a,t)=>a+(t.minutes||0),0);

  $("#pause").hidden = !["running","planning","waiting_on_you"].includes(s.status);

async function renderPlan(){

// The drawer's tabs: the task's notes, every file in its folder, then its agents' conversation once one has started.
const CONV = "@conversation", FILES = "@files";
function tabsFor(t){ return (t.files_present||[]).concat((t.folder||[]).length ? [FILES] : [], (t.sessions||[]).length ? [CONV] : []); }
function drawerTabs(files){
  const tabs = $("#d-tabs"), had = tabs._html;
  setHTML(tabs, files.map((f)=>`<button data-file="${esc(f)}" role="tab" aria-selected="${f===drawerFile}" class="${f===drawerFile?"on":""}">${f===CONV?"conversation":f===FILES?"files":esc(f.replace(".md",""))}</button>`).join(""));
  if(tabs._html !== had || !tabs.classList.contains("ready")) placeBar(tabs, !tabs.classList.contains("ready"));
}
async function showFile(id){
  const body = $("#d-body"), isConv = drawerFile===CONV, isFiles = drawerFile===FILES;
  body.classList.toggle("md", !isConv && !isFiles); conv = null;
  if(isConv) body.innerHTML = '<div class="c-pick" id="c-pick" role="group" aria-label="Agent"></div><div class="c-log" id="c-log"></div>';
  else if(isFiles){ body.innerHTML = '<ul class="f-list" id="f-list" aria-label="Files in the task folder"></ul>'; renderFolder(state.tasks.find((x)=>x.id===id)); }
  else { body.innerHTML = drawerFile ? md(await text(id, drawerFile)) : '<p class="empty">Nothing written yet.</p>'; if(drawerFile==="changes.md") markPaths(body, id); }
  body.scrollTop = 0; replay(body, "fade");
  if(isConv){ const t = state.tasks.find((x)=>x.id===id), pick = convChoices(t), live = liveSession(t);
    pickConv(pick.find((c)=>c.key===live) || pick[0]); }
}

// Conversations: each agent session of the task (planner or builder, its reviewers, each officer audit), read from
// its transcript a few new lines at a time on every refresh.
let conv = null;
const agentsOf = {};
function liveSession(t){
  const a = Object.values((state && state.agents) || {}).find((x)=>x.task===t.id); if(!a) return null;
  const s = (t.sessions||[]).filter((x)=>(x.role==="officer")===(a.role==="officer")).pop();
  return s ? s.session : null;
}
function convChoices(t){
  const out = [], seen = {};
  (t.sessions||[]).forEach((s)=>{
    out.push({key:s.session, sid:s.session, agent:"", label:s.role==="officer" ? `Officer · round ${s.round}` : s.role[0].toUpperCase()+s.role.slice(1)});
    (agentsOf[s.session]||[]).forEach((a)=>{
      const base = a.type==="coord-reviewer" ? "Reviewer" : (a.description || a.type || "Subagent"), n = seen[base] = (seen[base]||0)+1;
      out.push({key:s.session+"/"+a.agent, sid:s.session, agent:a.agent, label:n>1 ? `${base} ${n}` : base, sub:true});
    });
  });
  return out;
}
function renderPick(t){
  const el = $("#c-pick"); if(!el || !conv) return;
  const live = liveSession(t);
  setHTML(el, convChoices(t).map((c)=>`<button data-conv="${esc(c.key)}" class="${c.sub?"sub":""}${c.key===conv.key?" on":""}" aria-pressed="${c.key===conv.key}">${esc(c.label)}${c.key===live?'<span class="c-live">live</span>':""}</button>`).join(""));
}
function pickConv(c){
  if(!c) return;
  conv = {key:c.key, sid:c.sid, agent:c.agent, next:0, busy:false};
  const log = $("#c-log"); log.innerHTML = ""; replay(log, "fade");
  const t = state.tasks.find((x)=>x.id===drawer); if(t) renderPick(t);
  loadConv();
}
function convEntry(e){
  if(e.k==="text") return `<div class="c-say md">${md(e.text)}</div>`;
  if(e.k==="tool") return `<div class="c-call" data-call="${esc(e.id||"")}"><div class="c-tool"><b>${esc(e.name)}</b><span class="c-arg"${e.path?` data-path="${esc(e.path)}" tabindex="0" role="button"`:""} title="${esc(e.arg)}">${esc(e.arg)}</span></div></div>`;
  if(e.k==="prompt") return `<details class="c-prompt"><summary><span class="c-tag">Prompt</span><span class="c-first">${esc(e.text.split("\n")[0])}</span></summary><div class="c-full">${esc(e.text)}</div></details>`;
  if(e.k!=="result") return "";
  // First lines shown, the rest one click away.
  const head = e.text.split("\n").slice(0,3).join("\n").slice(0,360), rest = e.text.slice(head.length).replace(/^\n/,""), n = rest ? rest.split("\n").length : 0;
  return `<div class="c-res${e.error?" err":""}">${e.error?'<span class="c-tag bad">Error</span>':""}${e.images?`<span class="c-tag">${e.images} image${e.images>1?"s":""}</span>`:""}` +
    (head ? `<pre>${esc(head)}</pre>` : e.images ? "" : '<pre>No output</pre>') +
    (rest ? `<details><summary>${n>1?`${n} more lines`:"More"}</summary><pre>${esc(rest)}</pre></details>` : "") + "</div>";
}
async function loadConv(){
  const c = conv, body = $("#d-body"), log = $("#c-log"); if(!c || c.busy || !log) return;
  const first = c.next===0, t = state.tasks.find((x)=>x.id===drawer);
  c.busy = true;
  try{
    for(let i = 0; i < 20; i++){
      const r = await fetch(`/api/conversation?session=${encodeURIComponent(c.sid)}${c.agent?"&agent="+encodeURIComponent(c.agent):""}&offset=${c.next}`,{cache:"no-store"});
      const j = await r.json().catch(()=>({}));
      if(conv!==c) return;
      if(!r.ok){ if(!log.childElementCount) log.innerHTML = `<p class="empty">${r.status===404?"This agent's transcript isn't on this machine yet.":"This conversation can't be shown."}</p>`; return; }
      if(j.agents){ const had = JSON.stringify(agentsOf[c.sid]||[]); agentsOf[c.sid] = j.agents; if(t && had!==JSON.stringify(j.agents)) renderPick(t); }
      if(j.reset) log.innerHTML = "";
      c.next = j.next;
      const entries = j.entries||[];
      if(entries.length){
        const empty = log.querySelector(".empty"); if(empty) empty.remove();
        const end = body.scrollHeight - body.scrollTop - body.clientHeight < 32, tpl = document.createElement("template");
        // Each result goes under its own call: parallel calls are written first, their results after.
        entries.forEach((e)=>{
          tpl.innerHTML = convEntry(e); const el = tpl.content.firstElementChild; if(!el) return;
          if(!first) el.classList.add("fade");
          const call = e.k==="result" && e.for && log.querySelector(`[data-call="${CSS.escape(e.for)}"]`);
          (call || log).append(el);
        });
        // Follow the conversation only when the owner is already at the end.
        if(first ? t && liveSession(t)===c.key : end) body.scrollTo({top:body.scrollHeight, behavior:first||reduce.matches?"auto":"smooth"});
      }
      if(!j.more) break;
    }
    if(first && !log.childElementCount) log.innerHTML = '<p class="empty">Nothing said yet.</p>';
  }catch(e){}
  finally{ c.busy = false; }
}

// The task folder's files, each opening in the viewer.
function fmtSize(n){ return n < 1024 ? n+" B" : n < 1048576 ? Math.round(n/1024)+" KB" : (n/1048576).toFixed(1)+" MB"; }
function renderFolder(t){
  const el = $("#f-list"); if(!el || !t) return;
  setHTML(el, (t.folder||[]).map((f)=>{ const ext = (f.name.match(/\.([A-Za-z0-9]{1,5})$/)||[,"file"])[1];
    return `<li><button class="f-item" data-view="${esc(f.name)}"><span class="f-ext" aria-hidden="true">${esc(ext)}</span><span class="f-name">${esc(f.name)}</span><span class="f-size">${fmtSize(f.size)}</span></button></li>`; }).join(""));
}
// File paths written in a note (`bin/coord`, `/abs/path/x.png`, `viewer/index.html:12`) open in the viewer.
const EXT = /\.(md|png|jpe?g|gif|webp|svg|json|jsonl|ya?ml|toml|txt|log|py|js|mjs|cjs|ts|tsx|jsx|css|html|sh|astro|csv|lock)$/i;
function asPath(s){
  s = s.trim().replace(/:\d+(-\d+)?$/,"");
  if(!s || s.length > 400 || /[<>"'`|*?$(){}\[\]=;:,\\]|^[~-]/.test(s) || (/\s/.test(s) && s[0]!=="/")) return "";
  return /\/[^/]/.test(s) || EXT.test(s) ? s : "";
}
// Only paths the viewer can open are marked (each asked once), so a branch name or a MIME type isn't a dead end.
const opens = new Map();
function canOpen(path, task){
  const k = task+"\n"+path;
  if(!opens.has(k)) opens.set(k, fetch("/api/view?"+new URLSearchParams(Object.assign({path, meta:"1"}, task?{task}:{})),{cache:"no-store"})
    .then((r)=>r.ok).catch(()=>{ opens.delete(k); return false; }));
  return opens.get(k);
}
async function markPaths(root, task){
  const codes = [...root.querySelectorAll("code")].filter((c)=>!c.closest("pre,a")).map((c)=>[c, asPath(c.textContent)]).filter((x)=>x[1]);
  const ok = await Promise.all(codes.map(([,p])=>canOpen(p, task)));
  codes.forEach(([c,p],i)=>{ if(ok[i] && c.isConnected){ c.dataset.path = p; c.tabIndex = 0; c.setAttribute("role","button"); c.title = "Open "+p; } });
}

// The viewer: one file at a time over the page, read-only, served by this machine's own coordinator.
let viewSeq = 0, viewOpener = null;
const BEHIND = ["header.top","main","#drawer"];
function viewNone(title, detail){ return `<div class="v-none"><b>${esc(title)}</b><span>${esc(detail)}</span></div>`; }
async function openViewer(path, folder){
  const v = $("#viewer"), body = $("#v-body"), seq = ++viewSeq, task = drawer || "";
  if(!v.classList.contains("open")){ viewOpener = document.activeElement; BEHIND.forEach((s)=>$(s).inert = true); v.classList.add("open"); }
  const name = path.split("/").filter(Boolean).pop() || path;
  $("#v-title").textContent = name; $("#v-meta").textContent = path;
  body.className = "v-body"; body.innerHTML = '<p class="empty">Opening…</p>'; body.scrollTop = 0;
  $("#v-close").focus({preventScroll:true});
  const q = "/api/view?" + new URLSearchParams(Object.assign({path}, task?{task}:{}, folder?{in:"folder"}:{}));
  let m = null;
  try{ const r = await fetch(q+"&meta=1",{cache:"no-store"}); m = r.ok ? await r.json() : null; }catch(e){}
  if(seq!==viewSeq) return;
  const show = (html, cls) => { body.className = "v-body"+(cls?" "+cls:""); body.innerHTML = html; body.scrollTop = 0; replay(body, "fade"); };
  if(!m) return show(viewNone("Can't open this file", "It isn't in this run's folders, or it's no longer there."));
  $("#v-title").textContent = m.name; $("#v-meta").textContent = `${m.path} · ${fmtSize(m.size)}`;
  if(!m.ok) return show(viewNone("Can't preview this file", `${m.name} · ${fmtSize(m.size)}${m.kind==="binary"?"":" · too large to show"}`));
  if(m.kind==="image"){
    show(`<img class="v-img" alt="${esc(m.name)}">`, "img");
    const img = body.querySelector("img");
    img.onload = () => { if(seq!==viewSeq) return; img.classList.add("ready");
      if(img.naturalWidth) $("#v-meta").textContent = `${m.path} · ${img.naturalWidth} × ${img.naturalHeight} · ${fmtSize(m.size)}`; };
    img.onerror = () => { if(seq===viewSeq) show(viewNone("Can't preview this file", `${m.name} · ${fmtSize(m.size)}`)); };
    img.src = q; return;
  }
  let src = null;
  try{ const r = await fetch(q,{cache:"no-store"}); src = r.ok ? await r.text() : null; }catch(e){}
  if(seq!==viewSeq) return;
  if(src===null) return show(viewNone("Can't preview this file", `${m.name} · ${fmtSize(m.size)}`));
  if(m.kind==="markdown") return show(md(src), "md");
  const lines = src.replace(/\n$/,"").split("\n");
  show(`<pre class="v-code">${lines.map((l)=>"<span>"+esc(l)+"</span>").join("")}</pre>`);
}
function closeViewer(){
  const v = $("#viewer"), seq = ++viewSeq; if(!v.classList.contains("open")) return;
  v.classList.remove("open"); BEHIND.forEach((s)=>$(s).inert = false);
  if(viewOpener && viewOpener.isConnected) viewOpener.focus({preventScroll:true}); viewOpener = null;
  // Let it leave, then free what it held (a large image, a long file).
  setTimeout(()=>{ if(seq===viewSeq){ $("#v-body").innerHTML = ""; } }, ms("--co-dur-quick") + 50);
}
const viewerOpen = () => $("#viewer").classList.contains("open");

async function openDrawer(id, keep){
  const t = state && state.tasks.find((x)=>x.id===id); if(!t) return;
  const panel = $("#drawer"), opening = !panel.classList.contains("open"), was = drawerFile;
  if(opening) opener = document.activeElement;
  drawer = id; panel.classList.add("open");
  (pools.board||new Map()).forEach((el,k)=>el.classList.toggle("sel", k===id));
  $("#d-id").textContent = `${t.id} · ${t.type}`; $("#d-title").textContent = t.title;
  setHTML($("#d-meta"), `<span class="pill sm s-${esc(t.status)}">${LABEL[t.status]||esc(t.status)}</span>` +
    [t.model&&esc(`${t.model}${t.effort?" · "+t.effort:""}`), t.files.length&&`files: <span class="mono">${esc(t.files.join(", "))}</span>`, t.tokens&&esc(`${fmtTok(t.tokens)} tokens · ${fmtMin(t.minutes)}`)].filter(Boolean).map((x)=>`<span>${x}</span>`).join(""));
  const files = tabsFor(t);
  if(!keep || !files.includes(drawerFile)) drawerFile = files[0] || null;
  if(opening) $("#d-tabs").classList.remove("ready");
  drawerTabs(files);
  if(opening) $("#d-close").focus({preventScroll:true});
  if(!keep || drawerFile!==was) await showFile(t.id);
  else if(drawerFile===CONV){ renderPick(t); loadConv(); }
  else if(drawerFile===FILES) renderFolder(t);
}
function closeDrawer(){
  drawer = null; $("#drawer").classList.remove("open");
  (pools.board||new Map()).forEach((el)=>el.classList.remove("sel"));
  if(opener && opener.isConnected) opener.focus({preventScroll:true}); opener = null;
}
function showTab(tab){
  const tabs = $("#tabs");
  tabs.querySelectorAll("[data-tab]").forEach((x)=>{ const on = x.dataset.tab===tab; x.classList.toggle("on",on); x.setAttribute("aria-selected",on); });
  placeBar(tabs);
  ["board","plan","request"].forEach((x)=>{ const el = $("#tab-"+x);
    if(x!==tab) el.hidden = true; else if(el.hidden){ el.hidden = false; replay(el, "view-in"); } });
  if(tab==="plan") renderPlan();
}

document.addEventListener("click", async (e)=>{
  const b = e.target.closest("[data-path],[data-view],#v-close,#v-back,#w-jump,[data-act],[data-tab],[data-open-tab],[data-task].task,[data-file],[data-conv],[data-settle],[data-unsettle],#d-close,#pause,#resume");
  if(!b) return;
  if(b.id==="v-close" || b.id==="v-back") return closeViewer();
  if(b.dataset.path) return openViewer(b.dataset.path);
  if(b.dataset.view) return openViewer(b.dataset.view, true);
  if(b.id==="pause") return api("/api/pause"); if(b.id==="resume") return api("/api/resume");
  if(b.id==="d-close") return closeDrawer();
  if(b.id==="w-jump"){ scrollTo({top:0, behavior:reduce.matches?"auto":"smooth"}); return $("#w-title").focus({preventScroll:true}); }
  if(b.dataset.settle || b.dataset.unsettle) return settle(b.dataset.settle || b.dataset.unsettle, !!b.dataset.settle);
  if(b.dataset.file){ if(b.dataset.file===drawerFile) return; drawerFile = b.dataset.file; const t = state.tasks.find((x)=>x.id===drawer);
    drawerTabs(t ? tabsFor(t) : []); return showFile(drawer); }
  if(b.dataset.conv){ const t = state.tasks.find((x)=>x.id===drawer); if(!t || (conv && conv.key===b.dataset.conv)) return;
    return pickConv(convChoices(t).find((c)=>c.key===b.dataset.conv)); }
  const tab = b.dataset.tab || b.dataset.openTab;
  if(tab) return showTab(tab);
  if(b.classList.contains("task")) return openDrawer(b.dataset.task);
  const act = b.dataset.act;
  if(act==="approve-plan" || act==="send-plan") return sendPlan(b);
  if(act==="resume") return api("/api/resume");
  if(act==="accept") return api("/api/accept",{task:b.dataset.task});
  if(act==="todo"){ b.disabled = true; try{ await api("/api/todo",{n:+b.dataset.n}); } finally { b.disabled = false; } return; }
  if(act==="answer"){ const ta = document.querySelector(`textarea[data-answer="${CSS.escape(b.dataset.task)}"]`); if(!ta.value.trim()) return ta.focus();
    typing=false; return api("/api/answer",{task:b.dataset.task,text:ta.value.trim()}); }
});
// While the owner types or chooses, the attention cards aren't redrawn. The plan card keeps its choices in planPick,
// so it lets go as soon as focus leaves.
document.addEventListener("focusin",(e)=>{ if(e.target.matches("textarea, .pc input")) typing=true; });
document.addEventListener("focusout",(e)=>{ if(e.target.matches("textarea, .pc input") && (e.target.closest(".pc") || !e.target.value.trim())) typing=false; });
function planInput(e){
  const t = e.target, el = t.closest(".plan-card"); if(!el) return;
  if(t.matches("[data-plan-comment]")) planComment = t.value;
  else { const row = t.closest(".q"); if(!row) return; const p = planPick[row.dataset.q] ||= {};
    if(t.type==="radio"){ p.pick = t.value; const ta = row.querySelector(".q-own"), was = ta.hidden; ta.hidden = t.value!=="own";
      if(was && !ta.hidden){ replay(ta, "settle-in"); } }
    else if(t.matches(".q-own")) p.own = t.value; }
  planButtons(el);
}
document.addEventListener("input", planInput);
document.addEventListener("change", planInput);
document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && viewerOpen()) return closeViewer();
  if(e.key==="Escape" && drawer) return closeDrawer();
  // Focus stays inside the viewer while it is open.
  if(e.key==="Tab" && viewerOpen()){
    const f = [...$("#viewer").querySelectorAll('button,[href],[tabindex]:not([tabindex="-1"])')].filter((x)=>x.offsetParent || x===document.activeElement);
    const first = f[0], last = f[f.length-1], inside = $("#viewer").contains(document.activeElement);
    if(e.shiftKey && (document.activeElement===first || !inside)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (document.activeElement===last || !inside)){ e.preventDefault(); first.focus(); }
    return;
  }
  const p = e.target.closest && e.target.closest("[data-path]");
  if(p && p.tagName!=="BUTTON" && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); return openViewer(p.dataset.path); }
  const t = e.target.closest && e.target.closest(".task");
  if(t && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); openDrawer(t.dataset.task); }
});
addEventListener("resize",()=>{ placeBar($("#tabs"), true); if(drawer) placeBar($("#d-tabs"), true); });

$("#board").innerHTML = COLS.map(([key,label])=>`<section class="col" id="col-${key}" aria-label="${label}"><h2 class="col-h"><span>${label}</span><span class="count">0</span></h2><div class="list"></div></section>`).join("");
placeBar($("#tabs"), true);
document.fonts && document.fonts.ready.then(()=>placeBar($("#tabs"), true));

async function refresh(){
  try{ const r = await fetch("/api/state",{cache:"no-store"}); if(r.status===410){ setHTML($("#sub"), "This coordinator was terminated."); return; }
       const s = await r.json(); if(planReady(s) && !typing) planSrc = await text("", "plan.md");
       render(s); if(!$("#tab-plan").hidden) renderPlan(); }
  catch(e){ setHTML($("#sub"), "The coordinator is not answering. It may have been terminated."); }
}
refresh().then(()=>{ const tab = location.hash.slice(1); if(["plan","request"].includes(tab)) showTab(tab); });
setInterval(refresh, 3000);
</script>
</body>
