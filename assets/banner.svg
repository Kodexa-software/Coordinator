  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="500" y="178" font-size="92" fill="#f6efe0" letter-spacing="1">Coordinator</text>
    <text x="504" y="232" font-size="26" fill="#e6c983" font-style="italic">Conduct a team of Claude Code agents from one request.</text>
