<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title">
  <title id="title">Coordinator - conduct a team of Claude Code agents</title>
  <defs>
    <radialGradient id="bg" cx="18%" cy="20%" r="120%">
      <stop offset="0" stop-color="#232a52"/>
      <stop offset="0.5" stop-color="#151a36"/>
      <stop offset="1" stop-color="#0b0e1f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
